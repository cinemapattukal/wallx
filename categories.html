<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>WALLX — Categories</title><style>:root{--bg:#090b10;--panel:#11151e;--text:#f7f8fc;--muted:#939bad;--accent:#8b7cff;--border:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}header{position:sticky;top:0;background:#090b10e8;backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:18px 5%;display:flex;justify-content:space-between;align-items:center}a{color:#b6acff;text-decoration:none}.logo{font-size:24px;font-weight:900;letter-spacing:2px;color:white}.wrap{max-width:1200px;margin:auto;padding:35px 5%}.muted{color:var(--muted)}h1{font-size:clamp(28px,5vw,46px);margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}.card{display:block;overflow:hidden;border:1px solid var(--border);border-radius:16px;background:var(--panel);color:var(--text)}.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#151923}.card div{padding:14px;font-weight:750}.empty{padding:30px 0;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card div{padding:11px;font-size:13px}}</style></head><body><header><a class="logo" href="index.html">WALL<span style="color:var(--accent)">X</span></a><a href="index.html">← Home</a></header><main class="wrap"><h1>Explore Categories</h1><p class="muted">Choose a category to explore its wallpapers.</p><div id="grid" class="grid"></div><p id="empty" class="empty">Loading categories…</p></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>
const firebaseConfig={apiKey:"PASTE_YOUR_API_KEY",authDomain:"PASTE_YOUR_PROJECT_ID.firebaseapp.com",projectId:"PASTE_YOUR_PROJECT_ID",storageBucket:"PASTE_YOUR_STORAGE_BUCKET",messagingSenderId:"PASTE_YOUR_MESSAGING_SENDER_ID",appId:"PASTE_YOUR_APP_ID"};const grid=document.getElementById('grid'),empty=document.getElementById('empty');
if(firebaseConfig.apiKey==='PASTE_YOUR_API_KEY'){empty.textContent='Add your Firebase config in categories.html to load categories.'}else{firebase.initializeApp(firebaseConfig);firebase.firestore().collection('categories').where('published','==',true).get().then(s=>{grid.innerHTML='';s.forEach(d=>{const c=d.data(),a=document.createElement('a');a.className='card';a.href='category.html?id='+encodeURIComponent(d.id);const im=document.createElement('img');im.src=c.coverImage||'';im.alt=c.name||'Category';const title=document.createElement('div');title.textContent=c.name||'Category';a.append(im,title);grid.appendChild(a)});empty.style.display=s.empty?'block':'none';if(s.empty)empty.textContent='No published categories yet.'}).catch(e=>{empty.textContent='Could not load categories: '+e.message})}
</script></body></html>
