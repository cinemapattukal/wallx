<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>WALLX — Category</title><style>:root{--bg:#090b10;--panel:#11151e;--text:#f7f8fc;--muted:#939bad;--accent:#8b7cff;--border:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}header{padding:18px 5%;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:32px 5%}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-top:24px}.card{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:var(--panel)}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.card div{padding:10px;font-weight:650}.muted{color:var(--muted)}a{color:#b6acff;text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}</style></head><body><header><a href="index.html" style="font-weight:900">WALLX</a><a href="categories.html">All Categories</a></header><main class="wrap"><h1 id="title">Loading category…</h1><p class="muted" id="status"></p><div id="grid" class="grid"></div></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>
const firebaseConfig={apiKey:"PASTE_YOUR_API_KEY",authDomain:"PASTE_YOUR_PROJECT_ID.firebaseapp.com",projectId:"PASTE_YOUR_PROJECT_ID",storageBucket:"PASTE_YOUR_STORAGE_BUCKET",messagingSenderId:"PASTE_YOUR_MESSAGING_SENDER_ID",appId:"PASTE_YOUR_APP_ID"};const id=new URLSearchParams(location.search).get('id'),title=document.getElementById('title'),status=document.getElementById('status'),grid=document.getElementById('grid');if(!id){title.textContent='Category not found';}else if(firebaseConfig.apiKey==='PASTE_YOUR_API_KEY'){title.textContent='Firebase setup needed';status.textContent='Add your Firebase config in category.html.'}else{firebase.initializeApp(firebaseConfig);const db=firebase.firestore();db.collection('categories').doc(id).get().then(c=>{if(!c.exists||c.data().published!==true)throw new Error('Category not found or not published');title.textContent=c.data().name;return db.collection('wallpapers').where('categoryId','==',id).where('published','==',true).get()}).then(s=>{status.textContent=s.size+' wallpapers';s.forEach(d=>{const w=d.data(),card=document.createElement('article');card.className='card';const im=document.createElement('img');im.src=w.image;im.alt=w.title||'Wallpaper';const t=document.createElement('div');t.textContent=w.title||'Wallpaper';card.append(im,t);grid.appendChild(card)})}).catch(e=>{title.textContent='Category unavailable';status.textContent=e.message})}
</script></body></html>
