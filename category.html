<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>WALLX — Category</title><style>:root{--bg:#090b10;--panel:#11151e;--text:#f7f8fc;--muted:#939bad;--accent:#8b7cff;--border:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}header{padding:18px 5%;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:32px 5%}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-top:24px}.card{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:var(--panel)}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.card-info{padding:12px 10px 14px;text-align:center}.card-title{font-weight:750;line-height:1.4;overflow-wrap:anywhere;text-align:center}.download-btn{display:block;width:calc(100% - 24px);margin:0 12px 14px;border:1px solid #6555a2;border-radius:10px;padding:12px 10px;background:linear-gradient(110deg,#6857e8,#7850b8);color:#fff;font:inherit;font-weight:750;cursor:pointer}.download-btn:hover{filter:brightness(1.08)}.muted{color:var(--muted)}a{color:#b6acff;text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}</style></head><body><header><a href="index.html" style="font-weight:900">WALLX</a><a href="categories.html">All Categories</a></header><main class="wrap"><h1 id="title">Loading category…</h1><p class="muted" id="status"></p><div id="grid" class="grid"></div></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>

  
  const firebaseConfig = {
  apiKey: "AIzaSyB4gSdyhxjAfmrRU6fgCH6NyBl3yseT_Uw",
  authDomain: "wallx-69844.firebaseapp.com",
  projectId: "wallx-69844",
  storageBucket: "wallx-69844.firebasestorage.app",
  messagingSenderId: "938543747642",
  appId: "1:938543747642:web:97c43fa954dd817a2c1b03"
};

  
  const id=new URLSearchParams(location.search).get('id'),title=document.getElementById('title'),status=document.getElementById('status'),grid=document.getElementById('grid');if(!id){title.textContent='Category not found';}else if(firebaseConfig.apiKey==='PASTE_YOUR_API_KEY'){title.textContent='Firebase setup needed';status.textContent='Add your Firebase config in category.html.'}else{firebase.initializeApp(firebaseConfig);const db=firebase.firestore();db.collection('categories').doc(id).get().then(c=>{if(!c.exists||c.data().published!==true)throw new Error('Category not found or not published');title.textContent=c.data().name;return db.collection('wallpapers').where('categoryId','==',id).where('published','==',true).get()}).then(s=>{status.textContent=s.size+' wallpapers';s.forEach(d=>{const w=d.data(),card=document.createElement('article');card.className='card';const im=document.createElement('img');im.src=w.image||'';im.alt=w.title||'Wallpaper';im.loading='lazy';im.decoding='async';const info=document.createElement('div');info.className='card-info';const t=document.createElement('div');t.className='card-title';t.textContent=w.title||'Wallpaper';info.appendChild(t);const btn=document.createElement('button');btn.type='button';btn.className='download-btn';btn.textContent='Download';btn.addEventListener('click',()=>{if(!w.image){alert('Wallpaper image URL not found.');return;}const link=document.createElement('a');link.href=w.image;link.target='_blank';link.rel='noopener noreferrer';link.click();});card.append(im,info,btn);grid.appendChild(card)})}).catch(e=>{title.textContent='Category unavailable';status.textContent=e.message})}
</script></body></html>
